<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Álbum Mundial 2026</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

header{
background:#e10600;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.controls{
background:#fff;
padding:10px;
text-align:center;
border-bottom:1px solid #ccc;
}

input{
padding:6px;
width:170px;
}

button{
padding:5px 8px;
font-size:12px;
margin:3px;
cursor:pointer;
}

.tabs{
display:flex;
flex-wrap:wrap;
background:#111;
}

.tab{
flex:1 1 20%;
min-width:120px;
padding:10px;
text-align:center;
color:#fff;
cursor:pointer;
font-size:14px;
}

.active{
background:#e10600;
}

.page{
display:none;
padding:15px;
}

.show{
display:block;
}

details{
background:#fff;
margin-bottom:10px;
padding:10px;
border-radius:6px;
}

.groupGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(55px,1fr));
gap:4px;
}

.teamTitle{
font-weight:bold;
font-size:14px;
margin-bottom:6px;
display:flex;
justify-content:space-between;
align-items:center;
gap:5px;
flex-wrap:wrap;
}

.teamComplete{
color:#1db954;
}

.sticker{
background:#ddd;
font-size:clamp(11px,1.2vw,14px);
padding:clamp(6px,0.8vw,10px);
border-radius:4px;
cursor:pointer;
text-align:center;
word-break:break-word;
}

.sticker.have{
background:#ffd500;
}

.sticker.repeated{
background:#ffb347;
}

.progress{
height:20px;
background:#ddd;
border-radius:10px;
margin-top:10px;
overflow:hidden;
}

.bar{
height:20px;
background:#ffd500;
width:0%;
}

.searchBox{
margin-top:10px;
padding:10px;
background:#fff;
border-radius:6px;
}

.albumTeam{
margin-bottom:20px;
}

.albumPages{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:18px;
}

.albumPage{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(75px,1fr));
gap:8px;
}

.albumSticker{
background:#fff;
border-radius:14px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:10px;
min-height:85px;
position:relative;
box-shadow:0 2px 8px rgba(0,0,0,.08);
border:1px solid #ddd;
}

.albumEmpty{
visibility:hidden;
}

.repControls{
display:flex;
align-items:center;
gap:10px;
margin-bottom:8px;
}

.repBtn{
width:30px;
height:30px;
border:none;
border-radius:10px;
background:#e10600;
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.repBtn:hover{
opacity:.9;
}

.repCount{
min-width:24px;
text-align:center;
font-size:17px;
font-weight:bold;
}

.repDelete{
position:absolute;
top:6px;
right:6px;
width:22px;
height:22px;
border:none;
border-radius:50%;
background:#222;
color:#fff;
font-size:12px;
cursor:pointer;
}

.repNumber{
font-size:15px;
font-weight:bold;
}

.haveSticker{
background:#ffd500;
}

.hasRepeated{
background:#ff9f43;
border:2px solid #ff6b00;
}

.quickNav{
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:20px;
}

.quickRow{
display:grid;
grid-template-columns:repeat(12,minmax(55px,1fr));
gap:8px;
}

.quickBtn{
background:#111;
color:#fff;
border:none;
padding:10px;
border-radius:10px;
font-size:12px;
font-weight:bold;
cursor:pointer;
min-height:42px;
transition:.2s;
}

.quickBtn:hover{
background:#e10600;
}

.flashSection{
animation:flashAnim 1s ease;
}

@keyframes flashAnim{

0%{
box-shadow:0 0 0 rgba(225,6,0,0);
background:transparent;
}

50%{
box-shadow:0 0 30px rgba(225,6,0,.7);
background:rgba(225,6,0,.12);
}

100%{
box-shadow:0 0 0 rgba(225,6,0,0);
background:transparent;
}

}

@media(max-width:700px){

.quickRow{
grid-template-columns:repeat(4,1fr);
gap:6px;
}

.quickBtn{
padding:8px 4px;
font-size:10px;
min-height:34px;
border-radius:8px;
}

.quickNav{
gap:6px;
margin-bottom:14px;
}

.tab{
flex:1 1 50%;
}

.groupGrid{
grid-template-columns:1fr;
}

.albumPages{
flex-direction:column;
}

}

@media print{
button{
display:none;
}
}

</style>

<meta name="theme-color" content="#e10600">

<script>
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("service-worker.js");
});
}
</script>

function save(){
localStorage.setItem("album2026",JSON.stringify(data))
}

function stickerLabel(team,num){
if(num==1) return team+" 1 - LOGO"
if(num==13) return team+" 13 - EQUIPO"
return team+" "+num+" - @"
}

function updateSticker(el,id){

let count=data[id]||0

el.classList.remove("have","repeated")

if(count==1) el.classList.add("have")
if(count>1) el.classList.add("repeated")

}

function toggleSticker(id,el){

if(!data[id]) data[id]=1
else delete data[id]

updateSticker(el,id)

save()

let team=id.split(" ")[0]

if(team!="FWC" && team!="COCA"){
updateTeamTitle(team)
}

updateStats()

}

function sticker(parent,label){

let s=document.createElement("div")

s.className="sticker"

s.innerText=label

updateSticker(s,label)

s.onclick=()=>toggleSticker(label,s)

parent.appendChild(s)

}

function countTeam(team){

let have=0

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(data[label]) have++

}

return have

}

function updateTeamTitle(team){

document.querySelectorAll(".teamTitle").forEach(title=>{

if(title.dataset.team==team){

let count=countTeam(team)

title.classList.remove("teamComplete")

if(count==20)
title.classList.add("teamComplete")

let full=teamNames[team] || ""
let pages=teamPages[team] || ""

title.innerHTML=`
<div>
${team} - ${full}
<span style="font-size:11px;color:#666">
(Pág. ${pages})
</span>
<br>
${count} / 20
</div>

<button onclick="markTeam('${team}')">✔</button>
`

}

})

}

function markTeam(team){

let allMarked=true

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(!data[label]) allMarked=false

}

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(allMarked) delete data[label]
else data[label]=1

}

save()

document.querySelectorAll(".sticker").forEach(s=>{
updateSticker(s,s.innerText)
})

updateTeamTitle(team)

updateStats()

}

function buildAlbum(){

let container=document.getElementById("album")

container.innerHTML=""

buildQuickNav("album")



/* =========================
FWC
========================= */

let fwc=document.createElement("details")

fwc.open=true

fwc.id="section-FWC"

fwc.innerHTML=`<summary>FIFA WORLD CUP</summary>`

let fwcGrid=document.createElement("div")

fwcGrid.className="grid"

for(let i=0;i<20;i++){

sticker(fwcGrid,"FWC "+i)

}

fwc.appendChild(fwcGrid)

container.appendChild(fwc)



/* =========================
GRUPOS
========================= */

Object.keys(groups).forEach(g=>{

let det=document.createElement("details")

det.open=true

det.innerHTML=`<summary>GRUPO ${g}</summary>`

let groupGrid=document.createElement("div")

groupGrid.className="groupGrid"

groups[g].forEach(team=>{

let teamDiv=document.createElement("div")

teamDiv.id="section-"+team

let title=document.createElement("div")

title.className="teamTitle"

title.dataset.team=team

teamDiv.appendChild(title)

let grid=document.createElement("div")

grid.className="grid"

for(let i=1;i<=20;i++){

sticker(grid,stickerLabel(team,i))

}

teamDiv.appendChild(grid)

groupGrid.appendChild(teamDiv)

})

det.appendChild(groupGrid)

container.appendChild(det)

})



/* =========================
ACTUALIZAR TITULOS
========================= */

Object.keys(groups).forEach(g=>{

groups[g].forEach(team=>{

updateTeamTitle(team)

})

})



/* =========================
COCA COLA
========================= */

let coca=document.createElement("details")

coca.open=true

coca.id="section-COCA"

coca.innerHTML=`<summary>COCA COLA</summary>`

let cocaGrid=document.createElement("div")

cocaGrid.className="grid"

for(let i=1;i<=14;i++){

sticker(cocaGrid,"COCA "+i)

}

coca.appendChild(cocaGrid)

container.appendChild(coca)

}

function addDuplicate(id){

if(!data[id]) data[id]=1

data[id]++

save()

updateStats()

}

function removeDuplicate(id){

if(!data[id]) return

if(data[id] > 1)
data[id]--

save()

updateStats()

}

function deleteDuplicate(id){

if(!data[id]) return

if(data[id] > 1)
data[id]=1

save()
updateStats()

}

function createDuplicateSticker(label,num){

let count=data[label]||0
let repeats=count>1 ? count-1 : 0

let div=document.createElement("div")

div.className="albumSticker"

if(count==1)
div.classList.add("haveSticker")

if(count>1)
div.classList.add("hasRepeated")

let minusBtn=""
let deleteBtn=""

if(repeats>0){

minusBtn=`<button class="repBtn" onclick="removeDuplicate('${label}')">−</button>`

deleteBtn=`<button class="repDelete" onclick="deleteDuplicate('${label}')">✕</button>`

}

div.innerHTML=`

<div class="repTop">

${deleteBtn}

</div>

<div class="repControls">

${minusBtn}

<div class="repCount">${repeats}</div>

<button class="repBtn" onclick="addDuplicate('${label}')">+</button>

</div>

<div class="repNumber">${num}</div>

`

return div

}

function buildDuplicates(){

let div=document.getElementById("duplicates")

div.innerHTML=""


/* =========================
TITULO
========================= */

let title=document.createElement("h2")

title.innerText="Repetidas"

div.appendChild(title)



/* =========================
CREAR SECCION
========================= */

function createSection(title,prefix,total){

let section=document.createElement("div")

section.className="albumTeam"

section.id="section-"+prefix

section.innerHTML=`<h3>${title}</h3>`

let page=document.createElement("div")

page.className="albumPage"

for(let i=1;i<=total;i++){

let label
let displayNum=i

if(prefix=="FWC"){

label="FWC "+(i-1)
displayNum=i-1

}else{

label=prefix+" "+i

}

page.appendChild(
createDuplicateSticker(label,displayNum)
)

}

section.appendChild(page)

div.appendChild(section)

}



/* =========================
FWC
========================= */

createSection("FWC","FWC",20)



/* =========================
SELECCIONES
========================= */

Object.keys(groups).forEach(g=>{

let row=document.createElement("div")

row.className="groupGrid"

groups[g].forEach(team=>{

let section=document.createElement("div")

section.className="albumTeam"

section.id="section-"+team

section.innerHTML=`<h3>${team} - ${teamNames[team]}</h3>`

let page=document.createElement("div")

page.className="albumPage"

for(let i=1;i<=20;i++){

page.appendChild(
createDuplicateSticker(
stickerLabel(team,i),
i
)
)

}

section.appendChild(page)

row.appendChild(section)

})

div.appendChild(row)

})



/* =========================
COCA COLA
========================= */

createSection("COCA COLA","COCA",14)



/* =========================
NAV FINAL
========================= */

buildQuickNav("duplicates")

}

function updateStats(){

let total=994

let have=0

for(let k in data){

if(data[k]) have++

}

let percent=Math.floor(have/total*100)

let complete=[]

let missingTeams=[]

Object.keys(groups).forEach(g=>{

groups[g].forEach(team=>{

let missing=0

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(!data[label]) missing++

}

if(missing==0){
complete.push(team)
}else{
missingTeams.push(team+" ("+missing+")")
}

})

})

document.getElementById("stats").innerHTML=`

<h2>Resumen</h2>

<p><b>Total conseguidas:</b> ${have}</p>

<p><b>Total faltantes:</b> ${total-have}</p>

<p><b>Completado:</b> ${percent}%</p>

<div class="progress">
<div class="bar" style="width:${percent}%"></div>
</div>

<h3>Selecciones completas</h3>

<p>${complete.join(", ")||"Ninguna"}</p>

<h3>Total selecciones completas</h3>

<p>${complete.length}</p>

`

buildDuplicates()

}

function toggleMissing(){

onlyMissing=!onlyMissing

document.querySelectorAll(".sticker").forEach(s=>{

let label=s.innerText

s.style.display=(onlyMissing && data[label]) ? "none":"block"

})

}

function findSticker(){

let text=document.getElementById("search").value.toUpperCase().trim()

if(text===""){

document.getElementById("searchResult").innerHTML="Buscá una figurita (ej: ARG 17)"

return

}

let parts=text.split(" ")

if(parts.length<2 || isNaN(parseInt(parts[1]))){

document.getElementById("searchResult").innerHTML="Formato: ARG 17"

return

}

let team=parts[0]

let num=parseInt(parts[1])

let label=stickerLabel(team,num)

let count=data[label]||0

let status="FALTANTE"

if(count==1) status="TENÉS"

if(count>1) status="TENÉS REPETIDA ("+(count-1)+")"

document.getElementById("searchResult").innerHTML=`

<b>${label}</b><br>

Estado: ${status}<br><br>

<button onclick="addSticker('${label}')">
Marcar que la tengo
</button>

${count>=1 ? `
<button onclick="addDuplicate('${label}')">
Agregar repetida
</button>
` : ""}
`
}

function exportData(){

let dataStr=JSON.stringify(data,null,2)

let blob=new Blob([dataStr],{type:"application/json"})

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="album2026.json"

a.click()

}

function importData(event){

let file=event.target.files[0]

let reader=new FileReader()

reader.onload=function(e){

data=JSON.parse(e.target.result)

save()

location.reload()

}

reader.readAsText(file)

}

function buildPrintPage(title,content){

let w=window.open("","","width=900,height=700")

w.document.open()

w.document.write(`
<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<title>${title}</title>

<style>

@page{
size:auto;
margin:8mm;
}

html,body{
margin:0;
padding:0;
background:#f4f4f4;
font-family:Arial,sans-serif;
color:#111;
}

body{
padding:18px;
-webkit-print-color-adjust:exact;
print-color-adjust:exact;
}

h1{
background:#e10600;
color:#fff;
padding:16px;
border-radius:14px;
font-size:28px;
margin:0 0 20px 0;
}

.team{
padding:10px 0;
border-bottom:1px solid #eee;
font-size:15px;
line-height:1.5;
}

.team:last-child{
border-bottom:none;
}

@media print{

html,body{
background:#fff;
}

body{
padding:0;
}

.group{
box-shadow:none;
border:1px solid #ddd;
}

}

</style>

</head>

<body>

<h1>${title}</h1>

${content}

</body>

</html>
`)

w.document.close()

w.onload=function(){

setTimeout(()=>{

w.focus()

w.print()

},300)

}

}

function buildQuickNav(containerId){

let container=document.getElementById(containerId)

let oldNav=container.querySelector(".quickNav")

if(oldNav){
oldNav.remove()
}

let nav=document.createElement("div")

nav.className="quickNav"



/* =========================
FILA 1 - FWC
========================= */

let row1=document.createElement("div")

row1.className="quickRow"

let btnFWC=document.createElement("button")

btnFWC.className="quickBtn"

btnFWC.innerText="FWC"

btnFWC.onclick=()=>scrollToSection("FWC")

row1.appendChild(btnFWC)

nav.appendChild(row1)



/* =========================
FILAS 2 A 5
12 SELECCIONES
========================= */

let allTeams=[]

Object.keys(groups).forEach(g=>{

groups[g].forEach(team=>{

allTeams.push(team)

})

})

for(let i=0;i<allTeams.length;i+=12){

let row=document.createElement("div")

row.className="quickRow"

allTeams.slice(i,i+12).forEach(team=>{

let btn=document.createElement("button")

btn.className="quickBtn"

btn.innerText=team

btn.onclick=()=>scrollToSection(team)

row.appendChild(btn)

})

nav.appendChild(row)

}



/* =========================
FILA 6 - CC
========================= */

let row6=document.createElement("div")

row6.className="quickRow"

let btnCC=document.createElement("button")

btnCC.className="quickBtn"

btnCC.innerText="CC"

btnCC.onclick=()=>scrollToSection("COCA")

row6.appendChild(btnCC)

nav.appendChild(row6)



/* =========================
AGREGAR ARRIBA
========================= */

container.prepend(nav)

}

function scrollToSection(id){

requestAnimationFrame(()=>{

requestAnimationFrame(()=>{

let el=document.getElementById("section-"+id)

if(!el){
console.log("NO ENCONTRADO:",id)
return
}



/* =========================
SCROLL
========================= */

el.scrollIntoView({
behavior:"smooth",
block:"start"
})



/* =========================
DESTELLO
========================= */

el.classList.remove("flashSection")

void el.offsetWidth

el.classList.add("flashSection")

})

})

}

function openTab(e,id){

document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"))

document.getElementById(id).classList.add("show")

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))

e.target.classList.add("active")

}

buildAlbum()
updateStats()

</script>
