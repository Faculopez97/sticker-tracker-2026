<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker Álbum Mundial 2026</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

header{
background:#e10600;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.controls{
background:#fff;
padding:10px;
text-align:center;
border-bottom:1px solid #ccc;
}

input{
padding:6px;
width:170px;
}

button{
padding:5px 8px;
font-size:12px;
margin:3px;
cursor:pointer;
}

.tabs{
display:flex;
flex-wrap:wrap;
background:#111;
}

.tab{
flex:1 1 20%;
min-width:120px;
padding:10px;
text-align:center;
color:#fff;
cursor:pointer;
font-size:14px;
}

.active{
background:#e10600;
}

.page{
display:none;
padding:15px;
}

.show{
display:block;
}

details{
background:#fff;
margin-bottom:10px;
padding:10px;
border-radius:6px;
}

.groupGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(55px,1fr));
gap:4px;
}

.teamTitle{
font-weight:bold;
font-size:14px;
margin-bottom:6px;
display:flex;
justify-content:space-between;
align-items:center;
gap:5px;
flex-wrap:wrap;
}

.teamComplete{
color:#1db954;
}

.sticker{
background:#ddd;
font-size:clamp(11px,1.2vw,14px);
padding:clamp(6px,0.8vw,10px);
border-radius:4px;
cursor:pointer;
text-align:center;
word-break:break-word;
}

.sticker.have{
background:#ffd500;
}

.sticker.repeated{
background:#ffb347;
}

.progress{
height:20px;
background:#ddd;
border-radius:10px;
margin-top:10px;
overflow:hidden;
}

.bar{
height:20px;
background:#ffd500;
width:0%;
}

.searchBox{
margin-top:10px;
padding:10px;
background:#fff;
border-radius:6px;
}

.albumTeam{
margin-bottom:20px;
}

.albumPages{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:18px;
}

.albumPage{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
}

.albumSticker{
background:#fff;
border-radius:14px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:10px;
min-height:85px;
position:relative;
box-shadow:0 2px 8px rgba(0,0,0,.08);
border:1px solid #ddd;
}

.albumEmpty{
visibility:hidden;
}

.repControls{
display:flex;
align-items:center;
gap:10px;
margin-bottom:8px;
}

.repBtn{
width:30px;
height:30px;
border:none;
border-radius:10px;
background:#e10600;
color:#fff;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.repBtn:hover{
opacity:.9;
}

.repCount{
min-width:24px;
text-align:center;
font-size:17px;
font-weight:bold;
}

.repDelete{
position:absolute;
top:6px;
right:6px;
width:22px;
height:22px;
border:none;
border-radius:50%;
background:#222;
color:#fff;
font-size:12px;
cursor:pointer;
}

.repNumber{
font-size:15px;
font-weight:bold;
}



@media(max-width:700px){

.tab{
flex:1 1 50%;
}

.groupGrid{
grid-template-columns:1fr;
}

.albumPages{
flex-direction:column;
}

}

@media print{
button{
display:none;
}
}

</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e10600">

<script>
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("service-worker.js");
});
}
</script>

</head>

<body>

<header>Tracker Álbum Mundial 2026</header>

<div class="controls">

<input id="search" placeholder="ARG 17" oninput="findSticker()">

<button onclick="findSticker()">Buscar</button>

<button onclick="toggleMissing()">Solo faltantes</button>

<button onclick="exportData()">Guardar</button>

<input type="file" id="importFile" style="display:none" onchange="importData(event)">

<button onclick="document.getElementById('importFile').click()">Cargar</button>

<button onclick="printMissing()">Imprimir faltantes</button>

<button onclick="printOwned()">Imprimir las que tengo</button>

<div id="searchResult" class="searchBox">
Buscá una figurita para ver su estado.
</div>

</div>

<div class="tabs">
<div class="tab active" onclick="openTab(event,'fwc')">FWC</div>
<div class="tab" onclick="openTab(event,'teams')">SELECCIONES</div>
<div class="tab" onclick="openTab(event,'coca')">COCA COLA</div>
<div class="tab" onclick="openTab(event,'duplicates')">REPETIDAS</div>
<div class="tab" onclick="openTab(event,'stats')">RESUMEN</div>
</div>

<div id="fwc" class="page show"></div>
<div id="teams" class="page"></div>
<div id="coca" class="page"></div>
<div id="duplicates" class="page"></div>
<div id="stats" class="page"></div>

<script>

let onlyMissing=false

let data=JSON.parse(localStorage.getItem("album2026"))||{}

const teamNames={
MEX:"México",
RSA:"Sudáfrica",
KOR:"Corea del Sur",
CZE:"República Checa",
CAN:"Canadá",
BIH:"Bosnia y Herzegovina",
QAT:"Qatar",
SUI:"Suiza",
BRA:"Brasil",
MAR:"Marruecos",
HAI:"Haití",
SCO:"Escocia",
USA:"Estados Unidos",
PAR:"Paraguay",
AUS:"Australia",
TUR:"Turquía",
GER:"Alemania",
CUW:"Curazao",
CIV:"Costa de Marfil",
ECU:"Ecuador",
NED:"Países Bajos",
JPN:"Japón",
SWE:"Suecia",
TUN:"Túnez",
BEL:"Bélgica",
EGY:"Egipto",
IRN:"Irán",
NZL:"Nueva Zelanda",
ESP:"España",
CPV:"Cabo Verde",
KSA:"Arabia Saudita",
URU:"Uruguay",
FRA:"Francia",
SEN:"Senegal",
IRQ:"Irak",
NOR:"Noruega",
ARG:"Argentina",
ALG:"Argelia",
AUT:"Austria",
JOR:"Jordania",
POR:"Portugal",
COD:"Congo",
UZB:"Uzbekistán",
COL:"Colombia",
ENG:"Inglaterra",
CRO:"Croacia",
GHA:"Ghana",
PAN:"Panamá"
}

const groups={
A:["MEX","RSA","KOR","CZE"],
B:["CAN","BIH","QAT","SUI"],
C:["BRA","MAR","HAI","SCO"],
D:["USA","PAR","AUS","TUR"],
E:["GER","CUW","CIV","ECU"],
F:["NED","JPN","SWE","TUN"],
G:["BEL","EGY","IRN","NZL"],
H:["ESP","CPV","KSA","URU"],
I:["FRA","SEN","IRQ","NOR"],
J:["ARG","ALG","AUT","JOR"],
K:["POR","COD","UZB","COL"],
L:["ENG","CRO","GHA","PAN"]
}

function save(){
localStorage.setItem("album2026",JSON.stringify(data))
}

function stickerLabel(team,num){
if(num==1) return team+" 1 - LOGO"
if(num==13) return team+" 13 - EQUIPO"
return team+" "+num+" - @"
}

function updateSticker(el,id){

let count=data[id]||0

el.classList.remove("have","repeated")

if(count==1) el.classList.add("have")
if(count>1) el.classList.add("repeated")

}

function toggleSticker(id,el){

if(!data[id]) data[id]=1
else delete data[id]

updateSticker(el,id)

save()

let team=id.split(" ")[0]

if(team!="FWC" && team!="COCA"){
updateTeamTitle(team)
}

updateStats()

}

function sticker(parent,label){

let s=document.createElement("div")

s.className="sticker"

s.innerText=label

updateSticker(s,label)

s.onclick=()=>toggleSticker(label,s)

parent.appendChild(s)

}

function countTeam(team){

let have=0

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(data[label]) have++

}

return have

}

function updateTeamTitle(team){

document.querySelectorAll(".teamTitle").forEach(title=>{

if(title.dataset.team==team){

let count=countTeam(team)

title.classList.remove("teamComplete")

if(count==20)
title.classList.add("teamComplete")

let full=teamNames[team] || ""

title.innerHTML=`
<div>
${team} - ${full} (${count} / 20)
</div>

<button onclick="markTeam('${team}')">✔</button>
`

}

})

}

function markTeam(team){

let allMarked=true

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(!data[label]) allMarked=false

}

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(allMarked) delete data[label]
else data[label]=1

}

save()

document.querySelectorAll(".sticker").forEach(s=>{
updateSticker(s,s.innerText)
})

updateTeamTitle(team)

updateStats()

}

function buildFWC(){

let div=document.getElementById("fwc")

let grid=document.createElement("div")

grid.className="grid"

for(let i=0;i<20;i++){
sticker(grid,"FWC "+i)
}

div.appendChild(grid)

}

function buildCoca(){

let div=document.getElementById("coca")

let grid=document.createElement("div")

grid.className="grid"

for(let i=1;i<=14;i++){
sticker(grid,"COCA "+i)
}

div.appendChild(grid)

}

function buildTeams(){

let container=document.getElementById("teams")

for(let g in groups){

let det=document.createElement("details")

det.open=true

let sum=document.createElement("summary")

sum.innerText="GRUPO "+g

det.appendChild(sum)

let groupGrid=document.createElement("div")

groupGrid.className="groupGrid"

groups[g].forEach(team=>{

let teamDiv=document.createElement("div")

let title=document.createElement("div")

title.className="teamTitle"

title.dataset.team=team

let count=countTeam(team)

let full=teamNames[team] || ""

title.innerHTML=`
<div>
${team} - ${full} (${count} / 20)
</div>

<button onclick="markTeam('${team}')">✔</button>
`

if(count==20)
title.classList.add("teamComplete")

teamDiv.appendChild(title)

let grid=document.createElement("div")

grid.className="grid"

for(let i=1;i<=20;i++){

sticker(grid,stickerLabel(team,i))

}

teamDiv.appendChild(grid)

groupGrid.appendChild(teamDiv)

})

det.appendChild(groupGrid)

container.appendChild(det)

}

}

function addSticker(id){

data[id]=1

save()

updateStats()

}

function addDuplicate(id){

if(!data[id]) data[id]=1

data[id]++

save()

updateStats()

}

function removeDuplicate(id){

if(!data[id]) return

if(data[id]>1){
data[id]--
}

save()

updateStats()

}

function deleteDuplicate(id){

if(data[id]>1){
data[id]=1
}else{
delete data[id]
}

save()
updateStats()

}

function createDuplicateSticker(label,num){

let count=data[label]||0
let repeats=count>1 ? count-1 : 0
let hasSticker=count>=1

let div=document.createElement("div")
div.className="albumSticker"

if(!hasSticker){

div.innerHTML=`
<div class="repNumber">${num}</div>
`

return div

}

div.innerHTML=`

<button class="repDelete" onclick="deleteDuplicate('${label}')">×</button>

<div class="repControls">

<button class="repBtn" onclick="removeDuplicate('${label}')">−</button>

<div class="repCount">${repeats}</div>

<button class="repBtn" onclick="addDuplicate('${label}')">+</button>

</div>

<div class="repNumber">${num}</div>

`

return div

}

function buildDuplicates(){

let div=document.getElementById("duplicates")

div.innerHTML="<h2>Repetidas</h2>"

function createSection(title,prefix,total){

let section=document.createElement("div")

section.className="albumTeam"

section.innerHTML=`<h3>${title}</h3>`

let page=document.createElement("div")

page.className="albumPage"

for(let i=1;i<=total;i++){

let label

if(prefix=="FWC"){
label="FWC "+(i-1)
}else{
label=prefix+" "+i
}

page.appendChild(createDuplicateSticker(label,i))

}

section.appendChild(page)

div.appendChild(section)

}

createSection("FWC","FWC",20)

createSection("COCA COLA","COCA",14)

Object.keys(groups).forEach(g=>{

groups[g].forEach(team=>{

let section=document.createElement("div")

section.className="albumTeam"

section.innerHTML=`<h3>${team} - ${teamNames[team]}</h3>`

let page=document.createElement("div")

page.className="albumPage"

for(let i=1;i<=20;i++){

page.appendChild(
createDuplicateSticker(
stickerLabel(team,i),
i
)
)

}

section.appendChild(page)

div.appendChild(section)

})

})

}

function updateStats(){

let total=994

let have=0

for(let k in data){

if(data[k]) have++

}

let percent=Math.floor(have/total*100)

let complete=[]

let missingTeams=[]

Object.keys(groups).forEach(g=>{

groups[g].forEach(team=>{

let missing=0

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(!data[label]) missing++

}

if(missing==0){
complete.push(team)
}else{
missingTeams.push(team+" ("+missing+")")
}

})

})

document.getElementById("stats").innerHTML=`

<h2>Resumen</h2>

<p>${have} / ${total}</p>

<div class="progress">
<div class="bar" style="width:${percent}%"></div>
</div>

<p>${percent}%</p>

<h3>Selecciones completas</h3>

<p>${complete.join(", ")||"Ninguna"}</p>

<h3>Faltantes por selección</h3>

${missingTeams.map(t=>"<p>"+t+"</p>").join("")}

`

buildDuplicates()

}

function toggleMissing(){

onlyMissing=!onlyMissing

document.querySelectorAll(".sticker").forEach(s=>{

let label=s.innerText

s.style.display=(onlyMissing && data[label]) ? "none":"block"

})

}

function findSticker(){

let text=document.getElementById("search").value.toUpperCase().trim()

if(text===""){

document.getElementById("searchResult").innerHTML="Buscá una figurita (ej: ARG 17)"

return

}

let parts=text.split(" ")

if(parts.length<2 || isNaN(parseInt(parts[1]))){

document.getElementById("searchResult").innerHTML="Formato: ARG 17"

return

}

let team=parts[0]

let num=parseInt(parts[1])

let label=stickerLabel(team,num)

let count=data[label]||0

let status="FALTANTE"

if(count==1) status="TENÉS"

if(count>1) status="TENÉS REPETIDA ("+(count-1)+")"

document.getElementById

}

function exportData(){

let dataStr=JSON.stringify(data,null,2)

let blob=new Blob([dataStr],{type:"application/json"})

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="album2026.json"

a.click()

}

function importData(event){

let file=event.target.files[0]

let reader=new FileReader()

reader.onload=function(e){

data=JSON.parse(e.target.result)

save()

location.reload()

}

reader.readAsText(file)

}

function printMissing(){

let html="<h2>Faltantes</h2>"

Object.keys(groups).forEach(g=>{

groups[g].forEach(team=>{

let missing=[]

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(!data[label]) missing.push(i)

}

if(missing.length==0){
html+="<p>"+team+": COMPLETO</p>"
}else{
html+="<p>"+team+": "+missing.join(", ")+"</p>"
}

})

})

let w=window.open("")

w.document.write("<html><body>"+html+"</body></html>")

w.print()

}

function printOwned(){

let html="<h2>Figuritas que tengo</h2>"

Object.keys(groups).forEach(g=>{

groups[g].forEach(team=>{

let owned=[]

for(let i=1;i<=20;i++){

let label=stickerLabel(team,i)

if(data[label]) owned.push(i)

}

if(owned.length==20){
html+="<p>"+team+": COMPLETO</p>"
}else if(owned.length>0){
html+="<p>"+team+": "+owned.join(", ")+"</p>"
}

})

})

let w=window.open("")

w.document.write("<html><body>"+html+"</body></html>")

w.print()

}

function openTab(e,id){

document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"))

document.getElementById(id).classList.add("show")

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))

e.target.classList.add("active")

}

buildFWC()

buildCoca()

buildTeams()

updateStats()

</script>

</body>
</html>
